
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: comm_trainer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/CommunicationTrainer
    environment:
      ConnectionStrings__Default: Host=postgres;Database=comm_trainer;Username=postgres;Password=postgres
      Jwt__Key: "formatumTeestingApplicationSercretKey754!"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5081:80"

  frontend:
    build:
      context: ./frontend/frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata: